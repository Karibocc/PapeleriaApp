        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                        <h1>Usuarios</h1>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#usuarioModal" onclick="limpiarFormularioUsuario()"><i class="fas fa-plus"></i> Nuevo Usuario</button>
                    </div>
                    <div class="card mb-4">
                        <div class="card-header"><i class="fas fa-table me-1"></i> Listado de Usuarios</div>
                        <div class="card-body">
                            <table id="tablaUsuarios" class="table table-striped">
                                <thead><tr><th>ID</th><th>Usuario</th><th>Nombre Completo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto"><div class="container-fluid px-4"><div class="text-muted text-center">Copyright &copy; Papelería App 2026</div></div></footer>
        </div>
    </div>
    <div class="modal fade" id="usuarioModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Usuario</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="hidden" id="usuarioId">
                    <div class="mb-3"><label>Nombre de Usuario</label><input type="text" id="usuarioUsername" class="form-control"></div>
                    <div class="mb-3"><label>Contraseña</label><input type="password" id="usuarioPassword" class="form-control"></div>
                    <div class="mb-3"><label>Nombre Completo</label><input type="text" id="usuarioNombreCompleto" class="form-control"></div>
                    <div class="mb-3"><label>Correo</label><input type="email" id="usuarioEmail" class="form-control"></div>
                    <div class="mb-3"><label>Rol</label><select id="usuarioRol" class="form-control"><option value="1">Admin</option><option value="2">Vendedor</option><option value="3">Bodega</option></select></div>
                    <div class="mb-3"><label>Estado</label><select id="usuarioEstado" class="form-control"><option value="1">Activo</option><option value="2">Inactivo</option></select></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" onclick="guardarUsuario()">Guardar</button></div>
            </div>
        </div>
    </div>
