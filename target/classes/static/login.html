<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Login - Papelería App</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://use.fontawesome.com/releases/v6.3.0/css/all.css" rel="stylesheet" />
</head>
<body class="bg-primary">
    <div id="layoutAuthentication">
        <div id="layoutAuthentication_content">
            <main>
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-5">
                            <div class="card shadow-lg border-0 rounded-lg mt-5">
                                <div class="card-header">
                                    <h3 class="text-center font-weight-light my-4">Papelería App</h3>
                                    <p class="text-center text-muted">Iniciar Sesión</p>
                                </div>
                                <div class="card-body">
                                    <div id="alertError" class="alert alert-danger" role="alert" style="display: none;"></div>
                                    <div id="alert2FA" class="alert alert-warning" role="alert" style="display: none;"></div>
                                    <form id="loginForm">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="username" type="text" placeholder="Usuario" />
                                            <label for="username">Nombre de Usuario</label>
                                        </div>
                                        <div class="form-floating mb-3 position-relative">
                                            <input class="form-control" id="password" type="password" placeholder="Contraseña" />
                                            <label for="password">Contraseña</label>
                                            <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y" onclick="togglePassword('password')" style="z-index: 10;">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                        </div>
                                        <div id="twoFactorDiv" style="display: none;">
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="twoFactorCode" type="text" placeholder="Código 2FA" />
                                                <label for="twoFactorCode">Código de Autenticación de Dos Factores</label>
                                            </div>
                                        </div>
                                        <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                            <a class="small" href="forgot-password.html">¿Olvidaste tu contraseña?</a>
                                            <button type="submit" class="btn btn-primary" id="btnLogin">Ingresar</button>
                                        </div>
                                    </form>
                                </div>
                                <div class="card-footer text-center py-3">
                                    <div class="small"><a href="register.html">¿No tienes cuenta? Regístrate</a></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <div id="layoutAuthentication_footer">
            <footer class="py-4 bg-light mt-auto">
                <div class="container-fluid px-4">
                    <div class="d-flex align-items-center justify-content-between small">
                        <div class="text-muted">Copyright &copy; Papelería App 2026</div>
                        <div>
                            <a href="#">Política de Privacidad</a>
                            &middot;
                            <a href="#">Términos y Condiciones</a>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8085/api';
        let pendingUsername = null;
        
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.currentTarget.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        async function login(username, password) {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.status === 403 && data.requiresTwoFactor) {
                    return { requiresTwoFactor: true, username: data.username };
                }
                
                if (response.ok && data.accessToken) {
                    localStorage.setItem('authToken', data.accessToken);
                    localStorage.setItem('currentUser', JSON.stringify({
                        username: data.username,
                        rol: data.rol,
                        nombreCompleto: data.nombreCompleto
                    }));
                    return { success: true, data: data };
                }
                
                return { error: data.error || 'Credenciales inválidas' };
            } catch (error) {
                console.error('Error en login:', error);
                return { error: 'Error de conexión con el servidor' };
            }
        }
        
        async function loginWith2FA(username, code) {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/login/2fa`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, code })
                });
                
                const data = await response.json();
                
                if (response.ok && data.accessToken) {
                    localStorage.setItem('authToken', data.accessToken);
                    localStorage.setItem('currentUser', JSON.stringify({
                        username: data.username,
                        rol: data.rol,
                        nombreCompleto: data.nombreCompleto
                    }));
                    return { success: true, data: data };
                }
                
                return { error: data.error || 'Código 2FA inválido' };
            } catch (error) {
                console.error('Error en login 2FA:', error);
                return { error: 'Error de conexión' };
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const twoFactorCode = document.getElementById('twoFactorCode').value;
            const alertError = document.getElementById('alertError');
            const alert2FA = document.getElementById('alert2FA');
            const twoFactorDiv = document.getElementById('twoFactorDiv');
            const btnLogin = document.getElementById('btnLogin');
            
            alertError.style.display = 'none';
            alert2FA.style.display = 'none';
            
            if (twoFactorDiv.style.display === 'block' && pendingUsername) {
                btnLogin.disabled = true;
                btnLogin.innerText = 'Verificando...';
                
                const result = await loginWith2FA(pendingUsername, twoFactorCode);
                
                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    alertError.innerText = result.error;
                    alertError.style.display = 'block';
                    btnLogin.disabled = false;
                    btnLogin.innerText = 'Verificar Código 2FA';
                }
            } else {
                if (!username || !password) {
                    alertError.innerText = 'Por favor ingrese usuario y contraseña';
                    alertError.style.display = 'block';
                    return;
                }
                
                btnLogin.disabled = true;
                btnLogin.innerText = 'Ingresando...';
                
                const result = await login(username, password);
                
                if (result.requiresTwoFactor) {
                    pendingUsername = result.username;
                    twoFactorDiv.style.display = 'block';
                    alert2FA.innerText = 'Se requiere código de autenticación de dos factores';
                    alert2FA.style.display = 'block';
                    btnLogin.disabled = false;
                    btnLogin.innerText = 'Verificar Código 2FA';
                } else if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    alertError.innerText = result.error;
                    alertError.style.display = 'block';
                    btnLogin.disabled = false;
                    btnLogin.innerText = 'Ingresar';
                }
            }
        });
    </script>
</body>
</html>
