<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Recuperar Contraseña - Papelería App</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://use.fontawesome.com/releases/v6.3.0/css/all.css" rel="stylesheet" />
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-store"></i>
                </div>
                <h1 class="login-title">Recuperar Contraseña</h1>
                <p class="login-subtitle">Te enviaremos un enlace para restablecer tu contraseña</p>
            </div>

            <div id="alertError" class="alert-custom alert-danger-custom" style="display: none;"></div>
            <div id="alertSuccess" class="alert-custom alert-success-custom" style="display: none;"></div>

            <form id="forgotForm">
                <div class="input-group-custom">
                    <label class="input-label">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" class="input-field" placeholder="correo@ejemplo.com">
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                    <a href="login.html" class="forgot-link">
                        <i class="fas fa-arrow-left me-1"></i> Volver al Login
                    </a>
                    <button type="submit" class="login-btn" id="btnSend">Enviar Enlace</button>
                </div>
            </form>
        </div>
          </div>
            <footer class="footer-modern">
                <div class="container-fluid px-4">
                    <div class="d-flex align-items-center justify-content-between small">
                        <div class="text-muted">Copyright &copy; Papelería App 2026</div>
                <div>
                    <a href="privacidad.html">Política de Privacidad</a>
                    <span class="mx-1">&middot;</span>
                    <a href="terminos.html">Términos y Condiciones</a>
                </div>
                </div>
                </div>
            </footer>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
