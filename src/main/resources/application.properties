# Servidor y aplicación
server.port=8085
server.connection-timeout=30000
server.tomcat.connection-timeout=30000

app.base-url=http://localhost:8085
app.name=PapeleriaApp
app.jwt.secret=MiClaveSecretaSuperSeguraParaJWT2024ConMasDe256BitsDeLongitud1234567890
app.jwt.expiration=86400000

# Base de datos y pool de conexiones (HikariCP)
spring.datasource.url=jdbc:mysql://localhost:3306/papeleria_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de HikariCP para evitar bloqueos
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.idleTimeout=300000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.validationTimeout=5000
spring.datasource.hikari.leakDetectionThreshold=60000

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Recursos estáticos
spring.web.resources.static-locations=classpath:/static/

# Impresora
pos.printer.name=POS-58

# Logs
logging.level.org.springframework.security=INFO
logging.level.com.papeleria.security=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.transaction=DEBUG