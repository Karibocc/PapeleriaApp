<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Registro - Papelería App</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://use.fontawesome.com/releases/v6.3.0/css/all.css" rel="stylesheet" />
</head>
<body class="register-page">
    <div class="register-container">
        <div class="register-card">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-store"></i>
                </div>
                <h1 class="register-title">Crear Cuenta</h1>
                <p class="register-subtitle">Regístrate para comenzar</p>
            </div>

            <div id="alertError" class="alert-custom alert-danger-custom" style="display: none;"></div>
            <div id="alertSuccess" class="alert-custom alert-success-custom" style="display: none;"></div>

            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group-custom">
                            <label class="input-label">Nombre Completo</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" id="nombreCompleto" class="input-field" placeholder="Nombre completo">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group-custom">
                            <label class="input-label">Nombre de Usuario</label>
                            <div class="input-wrapper">
                                <i class="fas fa-at input-icon"></i>
                                <input type="text" id="username" class="input-field" placeholder="Usuario">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="input-group-custom">
                    <label class="input-label">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" class="input-field" placeholder="correo@ejemplo.com">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group-custom">
                            <label class="input-label">Contraseña</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="password" class="input-field" placeholder="Contraseña">
                                <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group-custom">
                            <label class="input-label">Confirmar Contraseña</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="confirmPassword" class="input-field" placeholder="Confirmar contraseña">
                                <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="input-group-custom">
                    <label class="input-label">Teléfono Móvil</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" id="telefonoMovil" class="input-field" placeholder="Teléfono móvil">
                    </div>
                </div>

                <button type="submit" class="register-btn" id="btnRegister">
                    <i class="fas fa-user-plus me-2"></i> Crear Cuenta
                </button>

                <div class="login-link">
                    <span>¿Ya tienes una cuenta? </span>
                    <a href="login.html">Inicia Sesión</a>
                </div>
            </form>
        </div>
        <div class="footer-text">
            <p>Copyright &copy; Papelería App 2026 | <a href="#">Política de Privacidad</a> | <a href="#">Términos y Condiciones</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
