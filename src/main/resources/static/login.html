<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Login - Papelería App</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://use.fontawesome.com/releases/v6.3.0/css/all.css" rel="stylesheet" />
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-store"></i>
                </div>
                <h1 class="login-title">Papelería App</h1>
                <p class="login-subtitle">Ingresa a tu cuenta</p>
            </div>

            <div id="alertError" class="alert-custom alert-danger-custom" style="display: none;"></div>
            <div id="alert2FA" class="alert-custom alert-warning-custom" style="display: none;"></div>

            <form id="loginForm">
                <div class="input-group-custom">
                    <label class="input-label">Nombre de Usuario</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" class="input-field" placeholder="Ingresa tu usuario" autocomplete="off">
                    </div>
                </div>

                <div class="input-group-custom">
                    <label class="input-label">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="input-field" placeholder="Ingresa tu contraseña">
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="twoFactorDiv" style="display: none;">
                    <div class="two-factor-info">
                        <i class="fas fa-shield-alt me-2"></i>
                        Se requiere código de autenticación de dos factores
                    </div>
                    <div class="input-group-custom">
                        <label class="input-label">Código 2FA</label>
                        <div class="input-wrapper">
                            <i class="fas fa-key input-icon"></i>
                            <input type="text" id="twoFactorCode" class="input-field" placeholder="Ingresa el código de 6 dígitos">
                        </div>
                    </div>
                </div>

                <div class="links-container">
                    <a href="forgot-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="login-btn" id="btnLogin">Iniciar Sesión</button>

                <div class="register-section">
                    <span class="register-text">¿No tienes una cuenta?</span>
                    <a href="register.html" class="register-link">Regístrate</a>
                </div>
            </form>
        </div>
        <div class="footer-text">
            <p>Copyright &copy; Papelería App 2026 | <a href="#">Política de Privacidad</a> | <a href="#">Términos y Condiciones</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
