<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Recuperar Contraseña - Papelería App</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://use.fontawesome.com/releases/v6.3.0/css/all.css" rel="stylesheet" />
</head>
<body class="bg-primary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header">
                        <h3 class="text-center font-weight-light my-4">Recuperar Contraseña</h3>
                    </div>
                    <div class="card-body">
                        <div id="alertError" class="alert alert-danger" role="alert" style="display: none;"></div>
                        <div id="alertSuccess" class="alert alert-success" role="alert" style="display: none;"></div>
                        <div class="small mb-3 text-muted">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</div>
                        <form id="forgotForm">
                            <div class="form-floating mb-3">
                                <input class="form-control" id="email" type="email" placeholder="correo@ejemplo.com" />
                                <label for="email">Correo Electrónico</label>
                            </div>
                            <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                <a class="small" href="login.html">Volver al Login</a>
                                <button type="submit" class="btn btn-primary">Enviar Enlace</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/role-permissions.js"></script>
</body>
</html>
