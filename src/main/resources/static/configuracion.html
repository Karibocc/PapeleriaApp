        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Configuración del Sistema</h1>
                    <div class="card mb-4">
                        <div class="card-header">Configuración General</div>
                        <div class="card-body">
                            <form id="configForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label>Nombre del Negocio</label><input type="text" id="nombre_negocio" class="form-control"></div>
                                    <div class="col-md-6 mb-3"><label>NIT</label><input type="text" id="nit_negocio" class="form-control"></div>
                                    <div class="col-md-6 mb-3"><label>Teléfono</label><input type="text" id="telefono" class="form-control"></div>
                                    <div class="col-md-6 mb-3"><label>Correo Electrónico</label><input type="email" id="correo_negocio" class="form-control"></div>
                                    <div class="col-md-12 mb-3"><label>Dirección</label><textarea id="direccion_negocio" class="form-control"></textarea></div>
                                    <div class="col-md-6 mb-3"><label>Porcentaje de IVA</label><input type="number" id="iva_porcentaje" class="form-control" step="0.01"></div>
                                    <div class="col-md-6 mb-3"><label>Impuesto Incluido</label><select id="iva_incluido" class="form-control"><option value="true">Sí</option><option value="false">No</option></select></div>
                                </div>
                                <button type="submit" class="btn btn-primary">Guardar Configuración</button>
                            </form>
                        </div>
                    </div>
                    <div class="card mb-4">
                        <div class="card-header">Cambiar Contraseña</div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4 mb-3"><label>Contraseña Actual</label><input type="password" id="currentPassword" class="form-control"></div>
                                <div class="col-md-4 mb-3"><label>Nueva Contraseña</label><input type="password" id="newPassword" class="form-control"></div>
                                <div class="col-md-4 mb-3"><label>Confirmar</label><input type="password" id="confirmNewPassword" class="form-control"></div>
                                <div class="col-md-12"><button class="btn btn-warning" onclick="cambiarContrasena()">Cambiar Contraseña</button></div>
                            </div>
                        </div>
                    </div>
