<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Restablecer Contraseña - Papelería App</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://use.fontawesome.com/releases/v6.3.0/css/all.css" rel="stylesheet" />
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-store"></i>
                </div>
                <h1 class="login-title">Nueva Contraseña</h1>
                <p class="login-subtitle">Ingresa tu nueva contraseña</p>
            </div>

            <div id="alertError" class="alert-custom alert-danger-custom" style="display: none;"></div>
            <div id="alertSuccess" class="alert-custom alert-success-custom" style="display: none;"></div>

            <form id="resetForm">
                <div class="input-group-custom">
                    <label class="input-label">Nueva Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="newPassword" class="input-field" placeholder="Nueva contraseña">
                        <button type="button" class="password-toggle" onclick="togglePassword('newPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group-custom">
                    <label class="input-label">Confirmar Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="confirmPassword" class="input-field" placeholder="Confirmar contraseña">
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                    <a href="login.html" class="forgot-link">
                        <i class="fas fa-arrow-left me-1"></i> Volver al Login
                    </a>
                    <button type="submit" class="login-btn" id="btnReset">Restablecer Contraseña</button>
                </div>
            </form>
        </div>
        <div class="footer-text">
            <p>Copyright &copy; Papelería App 2026 | <a href="#">Política de Privacidad</a> | <a href="#">Términos y Condiciones</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
